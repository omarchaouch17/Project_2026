<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ direction }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            color: #38bdf8;
        }

        a {
            color: #94a3b8;
        }

        input,
        select {
            padding: 8px;
            margin: 5px;
            border-radius: 4px;
            border: none;
        }

        button {
            padding: 8px 20px;
            background-color: #38bdf8;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .lang-switch a.active {
            color: #38bdf8;
            font-weight: bold;
        }

        /* Forms: label, field, range hint and red error message */
        .field {
            margin: 12px auto;
            width: min(320px, 90%);
            text-align: start;
        }

        .field label {
            display: block;
            font-size: 0.9em;
            margin-bottom: 2px;
        }

        .field input[type=text],
        .field input[type=number],
        .field select {
            width: 100%;
            box-sizing: border-box;
            margin: 0;
        }

        .hint {
            display: block;
            color: #94a3b8;
            font-size: 0.8em;
            margin-top: 2px;
        }

        .error {
            color: #f87171;
            font-size: 0.85em;
            min-height: 1.2em;
            margin-top: 2px;
        }

        .invalid {
            outline: 2px solid #f87171;
        }

        .error-box {
            background: #450a0a;
            border: 1px solid #f87171;
            color: #fecaca;
            border-radius: 6px;
            padding: 8px 12px;
            margin: 10px auto;
            width: min(320px, 90%);
        }

        .success-box {
            background: #052e16;
            border: 1px solid #34d399;
            color: #bbf7d0;
            border-radius: 6px;
            padding: 8px 12px;
            margin: 10px auto;
            width: min(320px, 90%);
        }

        .check {
            display: block;
            margin: 6px auto;
            width: min(320px, 90%);
            text-align: start;
        }

        /* Result page: risk category (always with text, not only colour), tips, emergency note */
        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 999px;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .badge-low { background: #064e3b; color: #a7f3d0; border-color: #34d399; }
        .badge-medium { background: #451a03; color: #fde68a; border-color: #fbbf24; }
        .badge-high { background: #450a0a; color: #fecaca; border-color: #f87171; }

        .tips {
            display: inline-block;
            max-width: min(520px, 92%);
            text-align: start;
            line-height: 1.5;
        }

        .emergency {
            margin: 14px auto;
            max-width: min(520px, 92%);
            padding: 8px 12px;
            border-inline-start: 4px solid #f87171;
            background: #1e293b;
            text-align: start;
        }
    </style>
</head>

<body>
    {% if show_languages %}
    <div class="lang-switch">
        {% for code in languages %}
        <a href="{{ language_path }}?lang={{ code }}" {% if code == lang %}class="active" {% endif %}>{{ code|upper }}</a>{% if not loop.last %} | {% endif %}
        {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</body>

</html>
